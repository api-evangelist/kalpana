name: Kalpana
description: Kalpana, Inc. was a Sunnyvale, California networking hardware company
  founded in 1990 by Vinod Bhardwaj and Larry Blair that built the first Ethernet
  switch, the seven-port EtherSwitch, and pioneered EtherChannel link aggregation and
  the Virtual LAN (VLAN) concept. The company was acquired by Cisco Systems in 1994
  and has been defunct as an independent entity ever since, with its technology absorbed
  into Cisco's Catalyst switching product line. There is no surviving developer portal,
  API, or public developer surface associated with the original Kalpana, Inc.
